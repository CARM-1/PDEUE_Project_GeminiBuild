name: PDEUE Wave 0 & 1 Qualification Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-chassis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install pytest ruff mypy fastapi uvicorn jsonschema prometheus_client httpx

      - name: Validate Contract Schemas
        run: |
          python -c "import json, glob, jsonschema; [jsonschema.Draft7Validator.check_schema(json.load(open(f, encoding='utf-8-sig'))) for f in glob.glob('contracts/schemas/*.json')]"

      - name: Execute Pytest Suite
        run: |
          cd backend
          PYTHONPATH=. python -m pytest
