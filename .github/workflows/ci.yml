name: PDEUE Pipeline & Qualification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Contract Schemas
        run: |
          python -c "import jsonschema, json, glob; [jsonschema.Draft7Validator.check_schema(json.load(open(f))) for f in glob.glob('contracts/schemas/*.json')]"

      - name: Execute Pytest Suite
        run: |
          cd backend
          pytest -v
