  <text x="44" y="324" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">ADR-008 Exact Cents (87/10/3) · ADR-012 High-Water Mark · Rule A14 100% SCMA Loss Isolation · Quarter-Kelly &amp; 40% Floor · ADR-011 Banking Air-Gap · Directive R-04 Kill Switch</text>
