<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" role="img" aria-label="House 09 House of the Lantern Bearers — Bordure indented Gules (Crimson)">
  <title>HOUSE-09 House of the Lantern Bearers (Bordure indented Gules (Crimson))</title>
  <desc>Foundational McCormick shield core (three royal-blue eagles and crimson zigzag fess dancette on silver) differenced under Scottish heraldry with Bordure indented Gules (Crimson).</desc>
  <defs>
    <linearGradient id="h09Gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE79C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A721C"/>
    </linearGradient>
    <clipPath id="h09Clip">
      <path d="M12 20 H88 V64 C88 89 68 104 50 113 C32 104 12 89 12 64 Z"/>
    </clipPath>
    <g id="h09Eagle">
      <path d="M0,-8.5 L2,-5.5 L8.5,-6.5 L10.5,-2.5 L6.5,-0.5 L9.5,2.2 L4.5,3 L2.8,1.8 L4.5,7.8 L1.2,5.6 L0,9.2 L-1.2,5.6 L-4.5,7.8 L-2.8,1.8 L-4.5,3 L-9.5,2.2 L-6.5,-0.5 L-10.5,-2.5 L-8.5,-6.5 L-2,-5.5 Z" fill="#1D4ED8" stroke="#0F2A6B" stroke-width="0.65" stroke-linejoin="round"/>
      <circle cx="0" cy="-6.6" r="1.3" fill="#1D4ED8"/>
    </g>
  </defs>
  <!-- House Numeral Coronet Badge -->
  <path d="M34 15 L39 7 L45 11 L50 5 L55 11 L61 7 L66 15 Z" fill="url(#h09Gold)" stroke="#FFF3C4" stroke-width="0.8"/>
  <rect x="34" y="15" width="32" height="3.2" rx="1.2" fill="url(#h09Gold)"/>
  <!-- Outer Shield -->
  <path d="M9 19 H91 V65 C91 91 70 107 50 117 C30 107 9 91 9 65 Z" fill="#991B1B" stroke="url(#h09Gold)" stroke-width="2.8"/>
  <g clip-path="url(#h09Clip)">
    <!-- Scottish Bordure Tincture Field -->
    <rect x="10" y="18" width="80" height="98" fill="#991B1B"/>
    <!-- Inner Silver Field Shaped by Bordure Differencing Edge -->
    <path d="M21 29 L26 33 L31 29 L36 33 L41 29 L46 33 L50 29 L54 33 L59 29 L64 33 L69 29 L74 33 L79 29 L75 35 L79 41 L75 47 L79 53 L75 59 L79 65 L73 72 L73 79 L66 85 L63 92 L55 96 L50 102 L45 96 L37 92 L34 85 L27 79 L27 72 L21 65 L25 59 L21 53 L25 47 L21 41 L25 35 Z" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.3"/>
    <!-- Foundational McCormick Crimson Zigzag Fess Dancette -->
    <path d="M21 65 L29 57 L37 65 L45 57 L53 65 L61 57 L69 65 L79 57 V66 L69 74 L61 66 L53 74 L45 66 L37 74 L29 66 L21 74 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="0.85"/>
    <!-- Foundational McCormick Three Royal-Blue Eagles -->
    <use href="#h09Eagle" transform="translate(37, 45) scale(0.86)"/>
    <use href="#h09Eagle" transform="translate(63, 45) scale(0.86)"/>
    <use href="#h09Eagle" transform="translate(50, 85) scale(0.86)"/>
  </g>
  <!-- Outer Hairline -->
  <path d="M12 20 H88 V64 C88 89 68 104 50 113 C32 104 12 89 12 64 Z" fill="none" stroke="url(#h09Gold)" stroke-width="1.2"/>
</svg>
