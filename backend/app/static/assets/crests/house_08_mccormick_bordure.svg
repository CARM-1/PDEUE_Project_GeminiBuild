<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" role="img" aria-label="House 08 House of the Silver Loom — Bordure engrailed Azure fimbriated Or">
  <title>HOUSE-08 House of the Silver Loom (Bordure engrailed Azure fimbriated Or)</title>
  <desc>Foundational McCormick shield core (three royal-blue eagles and crimson zigzag fess dancette on silver) differenced under Scottish heraldry with Bordure engrailed Azure fimbriated Or.</desc>
  <defs>
    <linearGradient id="h08Gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE79C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A721C"/>
    </linearGradient>
    <clipPath id="h08Clip">
      <path d="M12 20 H88 V64 C88 89 68 104 50 113 C32 104 12 89 12 64 Z"/>
    </clipPath>
    <g id="h08Eagle">
      <path d="M0,-8.5 L2,-5.5 L8.5,-6.5 L10.5,-2.5 L6.5,-0.5 L9.5,2.2 L4.5,3 L2.8,1.8 L4.5,7.8 L1.2,5.6 L0,9.2 L-1.2,5.6 L-4.5,7.8 L-2.8,1.8 L-4.5,3 L-9.5,2.2 L-6.5,-0.5 L-10.5,-2.5 L-8.5,-6.5 L-2,-5.5 Z" fill="#1D4ED8" stroke="#0F2A6B" stroke-width="0.65" stroke-linejoin="round"/>
      <circle cx="0" cy="-6.6" r="1.3" fill="#1D4ED8"/>
    </g>
  </defs>
  <!-- House Numeral Coronet Badge -->
  <path d="M34 15 L39 7 L45 11 L50 5 L55 11 L61 7 L66 15 Z" fill="url(#h08Gold)" stroke="#FFF3C4" stroke-width="0.8"/>
  <rect x="34" y="15" width="32" height="3.2" rx="1.2" fill="url(#h08Gold)"/>
  <!-- Outer Shield -->
  <path d="M9 19 H91 V65 C91 91 70 107 50 117 C30 107 9 91 9 65 Z" fill="#1E3A8A" stroke="url(#h08Gold)" stroke-width="2.8"/>
  <g clip-path="url(#h08Clip)">
    <!-- Scottish Bordure Tincture Field -->
    <rect x="10" y="18" width="80" height="98" fill="#1E3A8A"/>
    <!-- Inner Silver Field Shaped by Bordure Differencing Edge -->
    <path d="M22 29 Q27 33 32 29 Q37 33 42 29 Q46 33 50 29 Q54 33 58 29 Q63 33 68 29 Q73 33 78 29 Q74 35 78 41 Q74 47 78 53 Q74 59 78 65 Q73 72 72 79 Q66 86 62 92 Q56 97 50 101 Q44 97 38 92 Q34 86 28 79 Q27 72 22 65 Q26 59 22 53 Q26 47 22 41 Q26 35 22 29 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <!-- Foundational McCormick Crimson Zigzag Fess Dancette -->
    <path d="M21 65 L29 57 L37 65 L45 57 L53 65 L61 57 L69 65 L79 57 V66 L69 74 L61 66 L53 74 L45 66 L37 74 L29 66 L21 74 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="0.85"/>
    <!-- Foundational McCormick Three Royal-Blue Eagles -->
    <use href="#h08Eagle" transform="translate(37, 45) scale(0.86)"/>
    <use href="#h08Eagle" transform="translate(63, 45) scale(0.86)"/>
    <use href="#h08Eagle" transform="translate(50, 85) scale(0.86)"/>
  </g>
  <!-- Outer Hairline -->
  <path d="M12 20 H88 V64 C88 89 68 104 50 113 C32 104 12 89 12 64 Z" fill="none" stroke="url(#h08Gold)" stroke-width="1.2"/>
</svg>
