<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" role="img" aria-label="House 05 House of the Oak &amp; Compass — Bordure invected Vert (Forest Green)">
  <title>HOUSE-05 House of the Oak &amp; Compass (Bordure invected Vert (Forest Green))</title>
  <desc>Foundational McCormick shield core (three royal-blue eagles and crimson zigzag fess dancette on silver) differenced under Scottish heraldry with Bordure invected Vert (Forest Green).</desc>
  <defs>
    <linearGradient id="h05Gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE79C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A721C"/>
    </linearGradient>
    <clipPath id="h05Clip">
      <path d="M12 20 H88 V64 C88 89 68 104 50 113 C32 104 12 89 12 64 Z"/>
    </clipPath>
    <g id="h05Eagle">
      <path d="M0,-8.5 L2,-5.5 L8.5,-6.5 L10.5,-2.5 L6.5,-0.5 L9.5,2.2 L4.5,3 L2.8,1.8 L4.5,7.8 L1.2,5.6 L0,9.2 L-1.2,5.6 L-4.5,7.8 L-2.8,1.8 L-4.5,3 L-9.5,2.2 L-6.5,-0.5 L-10.5,-2.5 L-8.5,-6.5 L-2,-5.5 Z" fill="#1D4ED8" stroke="#0F2A6B" stroke-width="0.65" stroke-linejoin="round"/>
      <circle cx="0" cy="-6.6" r="1.3" fill="#1D4ED8"/>
    </g>
  </defs>
  <!-- House Numeral Coronet Badge -->
  <path d="M34 15 L39 7 L45 11 L50 5 L55 11 L61 7 L66 15 Z" fill="url(#h05Gold)" stroke="#FFF3C4" stroke-width="0.8"/>
  <rect x="34" y="15" width="32" height="3.2" rx="1.2" fill="url(#h05Gold)"/>
  <!-- Outer Shield -->
  <path d="M9 19 H91 V65 C91 91 70 107 50 117 C30 107 9 91 9 65 Z" fill="#15803D" stroke="url(#h05Gold)" stroke-width="2.8"/>
  <g clip-path="url(#h05Clip)">
    <!-- Scottish Bordure Tincture Field -->
    <rect x="10" y="18" width="80" height="98" fill="#15803D"/>
    <!-- Inner Silver Field Shaped by Bordure Differencing Edge -->
    <path d="M22 31 Q27 26 32 31 Q37 26 42 31 Q46 26 50 31 Q54 26 58 31 Q63 26 68 31 Q73 26 78 31 Q82 37 78 43 Q82 49 78 55 Q82 61 77 67 Q75 75 70 82 Q64 90 58 95 Q54 99 50 102 Q46 99 42 95 Q36 90 30 82 Q25 75 23 67 Q18 61 22 55 Q18 49 22 43 Q18 37 22 31 Z" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.3"/>
    <!-- Foundational McCormick Crimson Zigzag Fess Dancette -->
    <path d="M21 65 L29 57 L37 65 L45 57 L53 65 L61 57 L69 65 L79 57 V66 L69 74 L61 66 L53 74 L45 66 L37 74 L29 66 L21 74 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="0.85"/>
    <!-- Foundational McCormick Three Royal-Blue Eagles -->
    <use href="#h05Eagle" transform="translate(37, 45) scale(0.86)"/>
    <use href="#h05Eagle" transform="translate(63, 45) scale(0.86)"/>
    <use href="#h05Eagle" transform="translate(50, 85) scale(0.86)"/>
  </g>
  <!-- Outer Hairline -->
  <path d="M12 20 H88 V64 C88 89 68 104 50 113 C32 104 12 89 12 64 Z" fill="none" stroke="url(#h05Gold)" stroke-width="1.2"/>
</svg>
