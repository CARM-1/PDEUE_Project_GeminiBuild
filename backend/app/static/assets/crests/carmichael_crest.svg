<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" role="img" aria-label="Carmichael Family Compact Shield Emblem">
  <title>Carmichael Compact Shield Emblem</title>
  <desc>High-contrast compact header shield featuring the Carmichael blue and crimson wreathed fess over silver with a gold, black, and green heritage accent band.</desc>
  <defs>
    <linearGradient id="carmGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE79C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A721C"/>
    </linearGradient>
    <linearGradient id="carmSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDE6F2"/>
    </linearGradient>
    <clipPath id="carmShieldClip">
      <path d="M13 21 H87 V64 C87 88 68 103 50 112 C32 103 13 88 13 64 Z"/>
    </clipPath>
  </defs>
  <!-- Compact Coronet -->
  <path d="M33 15 L38 6 L44 11 L50 4 L56 11 L62 6 L67 15 Z" fill="url(#carmGold)" stroke="#FFF3C4" stroke-width="1" stroke-linejoin="round"/>
  <rect x="33" y="15" width="34" height="3.6" rx="1.4" fill="url(#carmGold)"/>
  <!-- Outer Shield -->
  <path d="M9 19 H91 V65 C91 91 70 107 50 117 C30 107 9 91 9 65 Z" fill="#0B132B" stroke="url(#carmGold)" stroke-width="3.2"/>
  <g clip-path="url(#carmShieldClip)">
    <!-- Silver Heraldic Field -->
    <rect x="10" y="19" width="80" height="96" fill="url(#carmSilver)"/>
    <!-- Subtle Gold / Black / Green Heritage Chief Trim -->
    <rect x="10" y="21" width="80" height="5" fill="#D4AF37"/>
    <rect x="10" y="26" width="80" height="4.5" fill="#111827"/>
    <rect x="10" y="30.5" width="80" height="5" fill="#15803D"/>
    <line x1="10" y1="35.8" x2="90" y2="35.8" stroke="#9A721C" stroke-width="1.2"/>
    <!-- Bold Carmichael Wreathed Fess (Azure & Gules) -->
    <rect x="10" y="51" width="80" height="20" fill="#1D4ED8"/>
    <path d="M8 71 L24 51 H38 L22 71 Z M36 71 L52 51 H66 L50 71 Z M64 71 L80 51 H94 L78 71 Z" fill="#B91C1C"/>
    <line x1="10" y1="51" x2="90" y2="51" stroke="#D4AF37" stroke-width="2.2"/>
    <line x1="10" y1="71" x2="90" y2="71" stroke="#D4AF37" stroke-width="2.2"/>
    <!-- Crisp Central Gold Buckle / Inescutcheon Accent -->
    <path d="M40 78 H60 V89 C60 96 55 101 50 104 C45 101 40 96 40 89 Z" fill="#0F172A" stroke="url(#carmGold)" stroke-width="2.2"/>
    <polygon points="50,83 55,90 50,97 45,90" fill="url(#carmGold)"/>
  </g>
  <!-- Crisp Inner Rim -->
  <path d="M13 21 H87 V64 C87 88 68 103 50 112 C32 103 13 88 13 64 Z" fill="none" stroke="url(#carmGold)" stroke-width="1.4"/>
</svg>
