<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" role="img" aria-label="Carmichael Family Crest">
  <defs>
    <linearGradient id="carmBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15264F"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="carmGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6DE8D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C23"/>
    </linearGradient>
    <clipPath id="carmShieldClip">
      <path d="M14 22 H86 V63 C86 86 67 101 50 110 C33 101 14 86 14 63 Z"/>
    </clipPath>
  </defs>
  <!-- Heraldic Coronet / Crest -->
  <path d="M35 16 L39 7 L45 12 L50 5 L55 12 L61 7 L65 16 Z" fill="url(#carmGold)" stroke="#F6DE8D" stroke-width="0.9" stroke-linejoin="round"/>
  <rect x="35" y="16" width="30" height="3.2" rx="1.2" fill="url(#carmGold)"/>
  <!-- Outer Shield -->
  <path d="M10 20 H90 V64 C90 90 69 106 50 116 C31 106 10 90 10 64 Z" fill="url(#carmBg)" stroke="url(#carmGold)" stroke-width="2.6"/>
  <!-- Inner Shield Hairline -->
  <path d="M14.5 24 H85.5 V63 C85.5 85.5 67 100.5 50 109.5 C33 100.5 14.5 85.5 14.5 63 Z" fill="none" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1"/>
  <!-- Shield Interior Motifs -->
  <g clip-path="url(#carmShieldClip)">
    <!-- Fess Wreathed (Carmichael heraldic band) -->
    <rect x="12" y="51" width="76" height="14" fill="#1E3A73"/>
    <path d="M14 65 L28 51 H40 L26 65 Z M40 65 L54 51 H66 L52 65 Z M66 65 L80 51 H90 L78 65 Z" fill="url(#carmGold)" opacity="0.9"/>
    <line x1="12" y1="51" x2="88" y2="51" stroke="#F6DE8D" stroke-width="1.2"/>
    <line x1="12" y1="65" x2="88" y2="65" stroke="#F6DE8D" stroke-width="1.2"/>
    <!-- Chief Twin Heraldic Stars -->
    <polygon points="33,31 35,36 40,36 36,39 37.5,44 33,41 28.5,44 30,39 26,36 31,36" fill="url(#carmGold)"/>
    <polygon points="67,31 69,36 74,36 70,39 71.5,44 67,41 62.5,44 64,39 60,36 65,36" fill="url(#carmGold)"/>
    <!-- Base Emblem: Upright Pillar & Laurel Chevron -->
    <path d="M50 72 L56 84 L50 96 L44 84 Z" fill="url(#carmGold)"/>
    <path d="M31 82 Q50 99 69 82" fill="none" stroke="#F6DE8D" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
