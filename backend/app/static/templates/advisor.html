<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDEUE - Advisor Lineage Workspace</title>
  <style>
    body { background: #0a0f1d; color: #e2e8f0; font-family: monospace; margin: 0; padding: 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 24px; }
    .card { background: #131c31; border: 1px solid #1e293b; border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    .card-title { font-size: 12px; color: #a855f7; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .val { font-size: 24px; font-weight: bold; color: #f8fafc; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1e293b; }
    th { color: #94a3b8; }
    .badge-custodial { background: #ea580c; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    .badge-optimal { background: #10b981; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h2 style="margin: 0; color: #c084fc;">Advisor Lineage Workspace</h2>
      <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Assigned Family Oversight & Read-Only PIT Inspection</div>
    </div>
    <span style="border: 1px solid #a855f7; color: #a855f7; padding: 4px 10px; border-radius: 4px; font-size: 12px;">READ-ONLY POSTURE</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">Household Total Equity</div>
      <div class="val" id="adv-eq">$0.00</div>
    </div>
    <div class="card">
      <div class="card-title">Max Lineal Drawdown</div>
      <div class="val" style="color: #4ade80;" id="adv-dd">0.00%</div>
    </div>
    <div class="card">
      <div class="card-title">CFCP Floor Shield</div>
      <div class="val" style="color: #38bdf8;" id="adv-shield">$0.00</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Monitored Sub-Account Balances & Custodial Lineage</div>
    <table>
      <thead>
        <tr><th>Account / Name</th><th>Role</th><th>SCMA ID</th><th>Balance</th><th>Risk Dial</th><th>Status</th></tr>
      </thead>
      <tbody id="sub-table"></tbody>
    </table>
  </div>

  <script>
    async function syncLineage() {
      const res = await fetch('/api/v1/portal/advisor/lineage?household_id=HOUSEHOLD-ALPHA');
      const data = await res.json();
      document.getElementById('adv-eq').innerText = '$' + data.total_equity.toFixed(2);
      document.getElementById('adv-dd').innerText = data.max_drawdown_pct.toFixed(2) + '%';
      document.getElementById('adv-shield').innerText = '$' + data.cfcp_floor_shield.toFixed(2);

      const tbody = document.getElementById('sub-table');
      tbody.innerHTML = data.sub_accounts.map(a => `
        <tr>
          <td><b>${a.name}</b></td>
          <td>${a.role}</td>
          <td>${a.scma_id}</td>
          <td>$${a.balance.toFixed(2)}</td>
          <td>${a.risk_dial.toFixed(1)}%</td>
          <td>${a.is_custodial ? '<span class="badge-custodial">CUSTODIAL APPRENTICE</span>' : '<span class="badge-optimal">ACTIVE</span>'}</td>
        </tr>
      `).join('');
    }
    syncLineage();
  </script>
</body>
</html>
