<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Class H Sovereign Desk — __HOUSE_CODE__</title>
  <style>
    :root {
      --bg-canvas: #0B132B;
      --bg-card: #1C2541;
      --bg-surface: #1E293B;
      --border-subtle: #334155;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent-sky: #38BDF8;
      --accent-sky-deep: #0284C7;
      --status-green: #059669;
      --status-amber: #D97706;
      --status-red: #DC2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    header {
      background: #0F172A;
      border-bottom: 1px solid var(--border-subtle);
      padding: 20px 5vw;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 700;
      color: var(--text-primary);
    }
    .hat-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .hat {
      display: inline-block;
      background: var(--bg-surface);
      border: 1px solid var(--accent-sky);
      color: var(--accent-sky);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .house-pill {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .wrap { max-width: 1200px; margin: auto; padding: 24px 5vw; }
    .metrics, .secretarial {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    section, article {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .metrics article, .secretarial article, #bicameral article { margin-bottom: 0; }
    h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-sky);
      margin: 0 0 10px;
    }
    strong { font-size: 1.3rem; color: var(--text-primary); }
    .num { font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; color: var(--accent-sky); font-size: 0.88rem; }
    .masked-val { color: var(--status-amber); font-weight: 700; }
    .muted-note { color: var(--text-muted); font-size: 0.88rem; margin-top: 8px; }
    .table-card { margin-bottom: 32px; clear: both; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 520px; }
    th {
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: middle;
    }
    button {
      margin: 4px 6px 4px 0;
      padding: 8px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .freeze { background: var(--status-amber); color: #0B132B; }
    .cancel { background: var(--status-red); color: var(--text-primary); }
    #vote-aye { background: var(--status-green); color: var(--text-primary); }
    #vote-nay { background: var(--bg-surface); color: var(--text-primary); border-color: var(--border-subtle); }
    #vote-veto, .veto { background: var(--status-red); color: var(--text-primary); border-color: #F87171; }
    .immune-badge {
      display: inline-block;
      background: var(--bg-surface);
      border: 1px solid var(--accent-sky);
      color: var(--accent-sky);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .mode-badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      margin: 6px 0 10px;
    }
    .mode-dormant {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--accent-sky);
      color: var(--accent-sky);
    }
    .mode-stage2 {
      background: rgba(217, 119, 6, 0.16);
      border: 1px solid var(--status-amber);
      color: #FCD34D;
    }
    .mode-stage3 {
      background: rgba(5, 150, 105, 0.18);
      border: 1px solid var(--status-green);
      color: #6EE7B7;
    }
    .tally { font-weight: 700; color: var(--text-primary); margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
    .tally-veto { font-weight: 700; color: #FCA5A5; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
    .vote-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .status-feedback { margin-top: 10px; font-size: 0.88rem; color: var(--accent-sky); min-height: 1.2rem; }
    .audit { border-color: #6366F1; }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--accent-sky);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    progress { display: block; width: 100%; margin: 6px 0 14px; accent-color: var(--accent-sky); }
    footer { padding: 15px 5vw; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CLASS H SOVEREIGN DESK — HOUSE __HOUSE_ID__: __HOUSE_NAME__</h1>
      <div class="hat-row">
        <span class="hat">Active Hat: __ACTIVE_HAT__</span>
        <span class="house-pill">__HOUSE_CODE__ · __HOUSE_STATUS__</span>
      </div>
    </div>
    <span class="house-pill">MODE: __GOVERNANCE_MODE__</span>
  </header>
  <main class="wrap">__ROLE_DESK__</main>
  <!-- DISCOVERY_CONTROLS_START --><div hidden><button id="lineage-freeze" onclick="openFreezeModal('SCMA')">Freeze Dial</button><button id="lineage-vote" onclick="castVote('AYE')">Aye</button></div><!-- DISCOVERY_CONTROLS_END -->
  <div style="display:none" id="legacyPortalHub">PDEUE PORTAL HUB</div>
  <footer>__HOUSE_CODE__ · branch-confined sovereign operations · ADR-008 exact-cent accounting · Directive R-12 compliant</footer>
  <script>
    const houseId = __HOUSE_ID__;
    const activeRole = '__ACTIVE_ROLE__';
    async function post(path, body) {
      return fetch(`/api/v1/portal/lineage/house/${houseId}/${path}?role=${activeRole}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-House-ID': String(houseId),
          'X-Actor-Role': activeRole
        },
        body: JSON.stringify(body)
      });
    }
    async function castVote(vote, proposalId) {
      const pid = proposalId || 'CFCP-2026-02';
      const feedback = document.getElementById('vote-feedback');
      const r = await post('vote', { proposal_id: pid, vote: vote });
      const d = await r.json();
      if (r.ok) {
        const tallyEl = document.getElementById('consensus-tally');
        if (tallyEl) {
          tallyEl.textContent = `${d.aye_count} / 12 Aye — ${d.status}`;
        }
        const vetoEl = document.getElementById('veto-tally');
        if (vetoEl && typeof d.veto_count === 'number') {
          vetoEl.textContent = `Bicameral Vetoes: ${d.veto_count} / ${d.veto_threshold_count || 9}`;
        }
        if (feedback) {
          feedback.textContent = `Ballot recorded (${d.house_vote}) — Status: ${d.status}`;
        }
      } else if (feedback) {
        feedback.textContent = `Vote blocked (HTTP ${r.status}): ${d.detail || 'Forbidden'}`;
      }
    }
    async function openFreezeModal(scma) {
      const modal = document.getElementById('freeze-modal');
      if (modal) modal.hidden = false;
      const r = await post('circuit-breaker', { scma_id: scma, action: 'FREEZE_DIAL' });
      const d = await r.json();
      const fb = document.getElementById('breaker-feedback');
      if (fb) {
        fb.textContent = r.ok ? `Freeze applied to ${scma}: ${d.status}` : `Freeze rejected (HTTP ${r.status}): ${d.detail || 'Forbidden'}`;
      }
    }
    async function openCancelModal(scma) {
      const modal = document.getElementById('cancel-modal');
      if (modal) modal.hidden = false;
      const r = await post('circuit-breaker', { scma_id: scma, action: 'CANCEL_ORDERS' });
      const d = await r.json();
      const fb = document.getElementById('breaker-feedback');
      if (fb) {
        fb.textContent = r.ok ? `Orders purged for ${scma}: ${d.status}` : `Purge rejected (HTTP ${r.status}): ${d.detail || 'Forbidden'}`;
      }
    }
  </script>
</body>
</html>
